name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The menu bar app: built, signed, notarized and stapled by
  # macos/scripts/release.sh (the same script a Mac with the credentials
  # runs), then uploaded to the release goreleaser just made, with the
  # appcast installed apps read (releases/latest/download/appcast.xml).
  # Until this job finishes, the latest release has no appcast: an app asks
  # Sparkle again on its next status read, at most an hour later. If it fails
  # (missing secrets, a notarization refusal, an Apple outage), the
  # appcast-fallback job below gives the release the previous one, so apps
  # keep a working feed; rerun this job to ship the new app.
  macos:
    name: macOS app
    needs: goreleaser
    # The app's version must be a clean X.Y.Z (Sparkle compares it, and the
    # bundled CLI treats anything else as a dev build): no app for a
    # pre-release.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    # Above release.sh's notarization wait (SKILLM_NOTARY_TIMEOUT, 40m) plus
    # the build, so a slow notarization fails the script (which keeps the
    # submission ID and log) rather than being cancelled by GitHub.
    timeout-minutes: 90
    env:
      KEYCHAIN_NAME: skillm-release.keychain-db
      SKILLM_NOTARY_PROFILE: skillm-notary
    steps:
      - name: Check the release secrets
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=""
          for name in MACOS_DEVELOPER_ID_P12_BASE64 MACOS_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_P8 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (see macos/scripts/release.sh)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Test the release scripts
        run: macos/scripts/test-find-identity.sh

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # A throwaway keychain holding the Developer ID identity and the
      # notarytool profile; removed at the end of the job.
      - name: Import the signing identity and notary credentials
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/$KEYCHAIN_NAME"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The Developer ID intermediate, so codesign can build the chain.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 --decode >"$p12"
          security import "$p12" -k "$keychain" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # Search this keychain too (codesign and find-identity use the list).
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # one path per word
          security list-keychains -d user -s "$keychain" $existing
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$APPLE_NOTARY_KEY_P8" >"$key"
          xcrun notarytool store-credentials "$SKILLM_NOTARY_PROFILE" \
            --key "$key" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$keychain"
          rm -f "$key"

      - name: Build, sign, notarize and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          SKILLM_NOTARY_KEYCHAIN="$RUNNER_TEMP/$KEYCHAIN_NAME" macos/scripts/release.sh "$GITHUB_REF_NAME"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: macos/scripts/publish-release.sh "$GITHUB_REF_NAME"

      - name: Keep the notarization log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: notarization
          path: macos/build/release/*/notarize/*.json
          if-no-files-found: ignore

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/$KEYCHAIN_NAME" || true

  # A release without appcast.xml breaks the feed of every installed app
  # (releases/latest/download/appcast.xml), and goreleaser has already made
  # this release the latest. When the macOS job did not finish, copy the
  # newest earlier appcast here: it still points at that release's app, so
  # apps see no update until the macOS job is rerun (its upload replaces
  # this copy). Nothing to copy before the first app release.
  appcast-fallback:
    name: Keep the previous appcast
    needs: [goreleaser, macos]
    if: ${{ always() && needs.goreleaser.result == 'success' && (needs.macos.result == 'failure' || needs.macos.result == 'cancelled') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Copy the previous release's appcast
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qxF appcast.xml; then
            echo "$GITHUB_REF_NAME already has an appcast.xml"
            exit 0
          fi
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName --jq '.[].tagName'); do
            [ "$tag" != "$GITHUB_REF_NAME" ] || continue
            dir="$RUNNER_TEMP/appcast-$tag"
            if gh release download "$tag" --pattern appcast.xml --dir "$dir" 2>/dev/null; then
              gh release upload "$GITHUB_REF_NAME" "$dir/appcast.xml"
              echo "::warning::the macOS app job did not finish: $GITHUB_REF_NAME serves $tag's appcast until that job is rerun"
              exit 0
            fi
          done
          echo "no earlier release has an appcast.xml: no app has shipped yet"
